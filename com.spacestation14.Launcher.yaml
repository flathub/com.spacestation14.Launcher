app-id: com.spacestation14.Launcher
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.dotnet10
build-options:
  prepend-path: "/usr/lib/sdk/dotnet10/bin"
  append-ld-library-path: "/usr/lib/sdk/dotnet10/lib"
  env:
    PKG_CONFIG_PATH: "/app/lib/pkgconfig:/app/share/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig:/usr/lib/sdk/dotnet10/lib/pkgconfig"

command: wrapper.sh

finish-args:
  - --device=dri
  # Allow all-device access for MIDI device support
  - --device=all
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  # TODO: Replace this with wayland and fallback-x11 once Wayland support
  #       becomes available:
  #       <https://github.com/AvaloniaUI/Avalonia/pull/8003>
  #       <https://github.com/space-wizards/RobustToolbox/issues/2468>
  # UPDATE: Engine supports Wayland soon:tm:, Launcher does not yet.
  - --socket=x11
  # Allow access to the Music directory for MIDI files
  - --filesystem=xdg-music
  # Allow access to Discord rich presence.
  - --filesystem=xdg-run/app/com.discordapp.Discord:create
  - --filesystem=xdg-run/discord-ipc-0
  - --env=DOTNET_ROOT=/app/lib/dotnet

modules:
  - name: dotnet
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/dotnet10/bin/install.sh

  - name: space-station-14-launcher
    buildsystem: simple
    build-commands:
      - dotnet publish SS14.Launcher/SS14.Launcher.csproj /p:FullRelease=True -c Release -r $(./rid.sh) --no-self-contained --source ./nuget-sources
      - dotnet publish SS14.Loader/SS14.Loader.csproj -c Release -r $(./rid.sh) --no-self-contained --source ./nuget-sources
      - mkdir -p ${FLATPAK_DEST}/bin
      - cp -r ${FLATPAK_BUILDER_BUILDDIR}/SS14.Launcher/bin/Release/net10.0/$(./rid.sh)/publish/* ${FLATPAK_DEST}/bin
      - mkdir -p ${FLATPAK_DEST}/bin/loader
      - cp -r ${FLATPAK_BUILDER_BUILDDIR}/SS14.Loader/bin/Release/net10.0/$(./rid.sh)/publish/* ${FLATPAK_DEST}/bin/loader
      # Upstream's desktop file is only bundled by its publish script, so
      # install it ourselves and point it at the Flatpak icon and wrapper.
      - install -Dm644 PublishFiles/SS14.desktop ${FLATPAK_DEST}/share/applications/com.spacestation14.Launcher.desktop
      - sed -i -e 's/^Icon=.*/Icon=com.spacestation14.Launcher/' -e 's/^Exec=.*/Exec=wrapper.sh %u/' ${FLATPAK_DEST}/share/applications/com.spacestation14.Launcher.desktop
    sources:
      - type: git
        url: https://github.com/space-wizards/SS14.Launcher.git
        tag: v0.40.2
        commit: bb05a4023e3b939a8d5b8d6a0c5a877b48c5dde7

      - sources/space-station-14-launcher-nuget-sources.json
      - sources/space-station-14-loader-nuget-sources.json
      - type: file
        path: rid.sh

    # The SS14.Launcher project does not include an SVG icon file, but one is
    # available in the asset-dump repository.
  - name: icon-file
    buildsystem: simple
    build-commands:
      - install -Dm644 logo-solo.svg /app/share/icons/hicolor/scalable/apps/com.spacestation14.Launcher.svg
    sources:
      - type: git
        url: https://github.com/space-wizards/asset-dump.git
        commit: d5389670127f7c9ee3cbf825dc4fcc2456e6c585

  - name: extra-data
    buildsystem: simple
    build-commands:
      - install -Dm644 com.spacestation14.Launcher.appdata.xml -t /app/share/metainfo
      - install -Dm755 wrapper.sh -t ${FLATPAK_DEST}/bin
    sources:
      # The upstream project does not include an appdata.xml file. Instead, we
      # write one from scratch.
      - type: file
        path: data/com.spacestation14.Launcher.appdata.xml
      # A wrapper for actually launching the game, to ensure discord RPC works.
      - type: file
        path: data/wrapper.sh
